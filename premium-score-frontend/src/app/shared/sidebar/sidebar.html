<aside
  class="sidebar d-flex flex-column"
  [class.collapsed]="isCollapsed()">

  <!-- ============================= -->
  <!-- SIDEBAR HEADER -->
  <!-- ============================= -->

  <div
    class="sidebar-header d-flex align-items-center justify-content-between px-3">

    <!-- Logo -->

    <div class="logo d-flex align-items-center">

      <i class="bi bi-grid-1x2-fill fs-5"></i>

      @if (!isCollapsed()) {
        <span class="ms-2 fw-semibold">
          Premium Admin
        </span>
      }

    </div>


    <!-- Toggle Button -->

    <button
      type="button"
      class="btn btn-link text-white p-0 toggle-btn"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar">

      @if (!isCollapsed()) {

        <i class="bi bi-chevron-left"></i>

      } @else {

        <i class="bi bi-chevron-right"></i>

      }

    </button>

  </div>


  <!-- ============================= -->
  <!-- NAVIGATION -->
  <!-- ============================= -->

  <nav class="sidebar-menu flex-grow-1 p-2">

    <!-- ============================= -->
    <!-- WEBSITES -->
    <!-- ============================= -->

    <a
      routerLink="/websites"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link sidebar-link d-flex align-items-center">

      <i class="bi bi-globe2 sidebar-icon"></i>

      @if (!isCollapsed()) {
        <span class="sidebar-text ms-3">
          Domain Whitelisting
        </span>
      }

    </a>


    <!-- ============================= -->
    <!-- NEW MATCHES -->
    <!-- ============================= -->

    <a
      routerLink="/matches/new"
      routerLinkActive="active"
      class="nav-link sidebar-link d-flex align-items-center">

      <i class="bi bi-plus-circle sidebar-icon"></i>

      @if (!isCollapsed()) {
        <span class="sidebar-text ms-3">
          New Match List
        </span>
      }

    </a>


    <!-- ============================= -->
    <!-- OLD MATCHES -->
    <!-- ============================= -->

    <a
      routerLink="/matches/old"
      routerLinkActive="active"
      class="nav-link sidebar-link d-flex align-items-center">

      <i class="bi bi-list-ul sidebar-icon"></i>

      @if (!isCollapsed()) {
        <span class="sidebar-text ms-3">
          Old Match List
        </span>
      }

    </a>

  </nav>


  <!-- ============================= -->
  <!-- FOOTER -->
  <!-- ============================= -->

  <div class="sidebar-footer p-2">

    <div
      class="admin-profile d-flex align-items-center p-2">

      <i class="bi bi-person-circle sidebar-icon"></i>

      @if (!isCollapsed()) {
        <span class="ms-3">
          Admin
        </span>
      }

    </div>

  </div>

</aside>
