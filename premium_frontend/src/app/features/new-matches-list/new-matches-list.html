  <!-- ================= SPORT TABS ================= -->

<div class="match-toolbar">

  <div class="d-flex gap-2">

    <button
      class="btn"
      [ngClass]="
        selectedSport === 'Cricket'
          ? 'btn-success'
          : 'btn-outline-success'
      "
      (click)="selectSport('Cricket')">

      🏏 Cricket

    </button>


    <button
      class="btn"
      [ngClass]="
        selectedSport === 'Soccer'
          ? 'btn-secondary'
          : 'btn-outline-secondary'
      "
      (click)="selectSport('Soccer')">

      ⚽ Soccer

    </button>


    <button
      class="btn"
      [ngClass]="
        selectedSport === 'Tennis'
          ? 'btn-warning'
          : 'btn-outline-warning'
      "
      (click)="selectSport('Tennis')">

      🎾 Tennis

    </button>


    <button
      class="btn btn-dark shadow-sm"
      (click)="refreshMatches()">

      <span class="me-2">↻</span>
      Refresh Match List

    </button>

  </div>

</div>


  <!-- ================= TABLE CARD ================= -->

  <div class="card border-0 shadow-sm">

    <div class="card-body p-0">

      <!-- Responsive horizontal scrolling -->
      <div class="table-responsive">

        <table
          class="table table-hover align-middle mb-0 matches-table">


          <!-- ================= TABLE HEADER ================= -->

          <thead class="table-dark">

            <tr>

              <th class="text-center">
                #
              </th>

              <th>
                Mkt ID
              </th>

              <th>
                Event
              </th>

              <th>
                Score ID
              </th>

              <th>
                Timeline Team Names
              </th>

              <th>
                Update Team Names
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>


          <!-- ================= TABLE BODY ================= -->

          <tbody>

            <tr *ngFor="let match of matches">


              <!-- NUMBER -->

              <td class="text-center">

                <span class="badge text-bg-danger rounded-pill">
                  {{ match.id }}
                </span>

              </td>


              <!-- MARKET ID -->

              <td>

                <div
                  *ngFor="let id of match.mktId"
                  class="text-primary fw-semibold">

                  {{ id }}

                </div>

              </td>


              <!-- EVENT -->

              <td class="event-column">

                <div class="fw-bold text-primary mb-1">
                  {{ match.eventName }}
                </div>

                <div class="fw-semibold text-success small mb-1">
                  {{ match.competition }}
                </div>

                <div class="text-primary small">
                  {{ match.date }}
                </div>

              </td>


              <!-- SCORE ID -->

              <td>

                <span
                  class="badge rounded-pill"
                  [ngClass]="
                    match.scoreId === '0'
                      ? 'text-bg-secondary'
                      : 'text-bg-primary'
                  ">

                  {{ match.scoreId }}

                </span>

              </td>


              <!-- ================= TIMELINE ================= -->

              <td>

                <div class="team-section">

                  <div class="text-success fw-bold mb-2">
                    Timeline
                  </div>


                  <!-- HOME -->

                  <label class="form-label small fw-semibold mb-1">
                    Home
                  </label>

                  <input
                    type="text"
                    class="form-control form-control-sm mb-2"
                    [value]="match.homeTeam || 'null'"
                    readonly
                  >


                  <!-- AWAY -->

                  <label class="form-label small fw-semibold mb-1">
                    Away
                  </label>

                  <input
                    type="text"
                    class="form-control form-control-sm mb-2"
                    [value]="match.awayTeam || 'null'"
                    readonly
                  >


                  <button
                    class="btn btn-dark btn-sm"
                    (click)="updateTeamNames(match, 'timeline')">

                    Update Team Names

                  </button>

                </div>

              </td>


              <!-- ================= UPDATE TEAM NAMES ================= -->

              <td>

                <div class="team-section">

                  <div class="fw-bold text-dark mb-2">
                    Update
                  </div>


                  <!-- HOME -->

                  <label class="form-label small fw-semibold mb-1">
                    Home
                  </label>

                  <input
                    type="text"
                    class="form-control form-control-sm mb-2"
                    [(ngModel)]="match.homeTeam"
                  >


                  <!-- AWAY -->

                  <label class="form-label small fw-semibold mb-1">
                    Away
                  </label>

                  <input
                    type="text"
                    class="form-control form-control-sm mb-2"
                    [(ngModel)]="match.awayTeam"
                  >


                  <button
                    class="btn btn-dark btn-sm"
                    (click)="updateTeamNames(match, 'update')">

                    Update Team Names

                  </button>

                </div>

              </td>


              <!-- ================= ACTIONS ================= -->

              <td>

                <div class="d-flex flex-column gap-2">

                  <!-- ROW 1 -->

                  <div class="d-flex gap-2">

                    <button
                      class="btn btn-info btn-sm text-dark flex-fill"
                      (click)="checkScore(match)">

                      Check Score

                    </button>


                    <button
                      class="btn btn-secondary btn-sm flex-fill"
                      (click)="ourFancy(match)">

                      Our Fancy

                    </button>

                  </div>


                  <!-- ROW 2 -->

                  <div class="d-flex gap-2">

                    <button
                      class="btn btn-sm flex-fill"
                      [ngClass]="
                        match.resultBlocked
                          ? 'btn-danger'
                          : 'btn-primary'
                      "
                      (click)="toggleResult(match)">

                      {{
                        match.resultBlocked
                          ? 'Unblock Result'
                          : 'Block Result'
                      }}

                    </button>


                    <button
                      class="btn btn-success btn-sm flex-fill"
                      (click)="allFancy(match)">

                      All Fancy

                    </button>

                  </div>

                </div>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
